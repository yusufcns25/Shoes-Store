<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SPEED - Ürün Detayı">
  <title>Ürün Detayı | SPEED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" href="/public/favicon.svg">
</head>
<body class="bg-black text-white font-sans antialiased">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-xl border-b border-surface-800">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-10 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-black tracking-tighter">SPEED<span class="text-brand-500">.</span></a>
      <a href="index.html" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-surface-400 hover:text-white transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Geri Dön
      </a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-[1400px] mx-auto px-6 lg:px-10 py-10 lg:py-20">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16">

      <!-- SOL: Resim Galerisi -->
      <div class="w-full">
        <div id="galeri-container" class="relative overflow-hidden rounded-3xl bg-surface-900 aspect-square lg:aspect-[4/5] max-h-[700px] mb-4 cursor-zoom-in">
          <img id="ana-resim" src="" class="w-full h-full object-cover transition-all duration-500" alt="Ürün">
          <div id="badge-container"></div>
          <!-- Ok Butonları -->
          <button id="ok-sol" class="hidden absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/50 backdrop-blur-sm rounded-full text-white flex items-center justify-center hover:bg-black/70 transition-all active:scale-90 z-10">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button id="ok-sag" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/50 backdrop-blur-sm rounded-full text-white flex items-center justify-center hover:bg-black/70 transition-all active:scale-90 z-10">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <!-- Resim Sayacı -->
          <div id="resim-sayaci" class="hidden absolute bottom-4 right-4 bg-black/50 backdrop-blur-sm text-white text-xs font-semibold px-3 py-1.5 rounded-full z-10"></div>
        </div>
        <!-- Thumbnail'ler -->
        <div id="thumbnails" class="flex gap-3 overflow-x-auto pb-2"></div>
      </div>

  <!-- TAM EKRAN LİGHTBOX -->
  <div id="lightbox" class="fixed inset-0 z-[100] hidden bg-black/95 backdrop-blur-sm">
    <div class="absolute inset-0 flex items-center justify-center">
      <img id="lightbox-img" src="" alt="Tam Ekran" class="max-w-[90vw] max-h-[90vh] object-contain transition-transform duration-300" style="transform: scale(1)">
    </div>
    <!-- Lightbox Kontroller -->
    <div class="absolute top-4 right-4 flex gap-2 z-10">
      <button id="lb-zoom-in" class="w-10 h-10 bg-white/10 backdrop-blur rounded-full text-white flex items-center justify-center hover:bg-white/20 transition-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>
      </button>
      <button id="lb-zoom-out" class="w-10 h-10 bg-white/10 backdrop-blur rounded-full text-white flex items-center justify-center hover:bg-white/20 transition-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
      </button>
      <button id="lb-kapat" class="w-10 h-10 bg-white/10 backdrop-blur rounded-full text-white flex items-center justify-center hover:bg-white/20 transition-all">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <!-- Lightbox Oklar -->
    <button id="lb-sol" class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/10 backdrop-blur rounded-full text-white flex items-center justify-center hover:bg-white/20 transition-all">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="lb-sag" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-white/10 backdrop-blur rounded-full text-white flex items-center justify-center hover:bg-white/20 transition-all">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div id="lb-sayac" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-white/60 text-sm font-medium"></div>
  </div>

      <!-- SAĞ: Ürün Bilgileri -->
      <div class="flex flex-col pt-2 lg:pt-4">
        <p id="detay-kategori" class="text-brand-400 text-sm font-bold uppercase tracking-[0.2em] mb-3"></p>
        <h1 id="detay-ad" class="text-4xl lg:text-6xl font-black uppercase tracking-tighter leading-none mb-5"></h1>
        <p id="detay-fiyat" class="text-2xl lg:text-3xl font-light text-surface-300 mb-10"></p>

        <div class="border-t border-surface-800 pt-8 mb-10">
          <h3 class="text-xs font-bold uppercase tracking-[0.2em] text-surface-500 mb-4">Ürün Hakkında</h3>
          <p id="detay-aciklama" class="text-surface-400 text-lg leading-relaxed"></p>
        </div>

        <!-- WhatsApp Sipariş -->
        <a id="wp-link" href="#" target="_blank"
           class="bg-[#25D366] text-white py-5 rounded-full font-bold text-center text-lg hover:brightness-110 transition-all flex items-center justify-center gap-4 shadow-xl active:scale-95 mb-4">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          WHATSAPP İLE SİPARİŞ VER
        </a>
        <p class="text-center text-surface-600 text-xs">Ürün bilgisi otomatik olarak mesaja eklenecektir</p>
      </div>
    </div>

    <!-- İLGİLİ ÜRÜNLER -->
    <section class="mt-20 lg:mt-28 border-t border-surface-800 pt-16">
      <h2 class="text-2xl lg:text-3xl font-black uppercase tracking-tighter mb-10">Diğer Ürünler</h2>
      <div id="ilgili-urunler" class="grid grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-surface-800 bg-surface-950 mt-20">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-10 py-10 flex flex-col md:flex-row justify-between items-center gap-4">
      <p class="text-surface-500 text-xs">&copy; 2026 SPEED. Tüm hakları saklıdır.</p>
      <a href="index.html" class="text-sm font-bold text-surface-400 hover:text-white transition-colors">SPEED<span class="text-brand-500">.</span></a>
    </div>
  </footer>

  <!-- WHATSAPP FLOATING -->
  <a id="wp-float-detail" href="https://wa.me/905555555555?text=Merhaba,%20SPEED%20sitesindeki%20ürünler%20hakkında%20bilgi%20almak%20istiyorum." target="_blank"
     class="wp-pulse fixed bottom-6 right-6 bg-[#25D366] text-white w-14 h-14 rounded-full shadow-2xl hover:scale-110 transition-transform z-50 flex items-center justify-center">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

  <script type="module" src="/src/urun-detay.js"></script>

</html>
